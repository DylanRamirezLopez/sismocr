# Render Blueprint — auto-deploy API
# Worker runs as background task inside the API (free tier compatible)
# La BD está fuera de Render: su plan gratuito se borra a los 30 días más 14 de gracia
services:
  - type: web
    name: sismocr-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_API_V2
        value: "true"
